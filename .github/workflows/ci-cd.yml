# .github/workflows/ci-cd.yml
name: Deploy Churn Predictor
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build and Push Docker
        run: |
          docker build -t myregistry/churn-model:latest -f docker/Dockerfile .
          docker push myregistry/churn-model:latest

      - name: Apply KServe Manifests
        run: |
          kubectl apply -f manifests/kserve-inference.yaml
