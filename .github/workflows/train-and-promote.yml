# .github/workflows/train-and-promote.yml
name: Train and Promote Churn Model

on:
  push:
    paths:
      - 'ml/**'
      - 'data/**'
      - 'Makefile'
  workflow_dispatch:

jobs:
  train-and-promote:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'file:./mlruns' }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r ml/requirements.txt

      - name: Train model
        run: |
          make train

      - name: Promote model if best
        if: ${{ startsWith(env.MLFLOW_TRACKING_URI, 'http') }}
        run: |
          make promote
